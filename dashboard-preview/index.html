<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>GNOME HOME Dashboard</title>
  <style>
    :root {
      color-scheme: dark;
      --background: #061117;
      --panel: #0b2029;
      --panel-strong: #102d38;
      --line: #235868;
      --cyan: #43d9df;
      --orange: #ff9d24;
      --text: #eefbfc;
      --muted: #8fb0b8;
    }

    * { box-sizing: border-box; }

    body {
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      padding: 20px;
      color: var(--text);
      background: radial-gradient(circle at 50% 0, #143746, var(--background) 58%);
      font: 14px/1.35 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    }

    .device {
      width: min(100%, 760px);
      padding: 9px;
      border: 1px solid var(--cyan);
      border-radius: 20px;
      background: linear-gradient(145deg, var(--orange) 0 7%, #073747 7% 93%, var(--orange) 93%);
      box-shadow: 0 20px 70px #000a;
    }

    .screen {
      position: relative;
      display: grid;
      grid-template-rows: auto 1fr auto;
      width: 100%;
      aspect-ratio: 3 / 2;
      overflow: hidden;
      border: 2px solid var(--cyan);
      border-radius: 11px;
      background: radial-gradient(circle at 72% 0, #173d4a, #071820 58%);
    }

    .screen::after {
      content: "";
      position: absolute;
      inset: 0;
      pointer-events: none;
      background: repeating-linear-gradient(0deg, transparent 0 3px, #8cf5fa08 4px);
    }

    header,
    footer {
      position: relative;
      z-index: 1;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 2.2% 3.5%;
      background: #081b23dd;
    }

    header { border-bottom: 1px solid var(--line); }
    footer { border-top: 1px solid var(--line); }

    .brand {
      font-size: clamp(14px, 3vw, 21px);
      font-weight: 900;
      letter-spacing: .04em;
      text-shadow: 2px 2px #b95713;
    }

    .brand span { color: var(--orange); }

    .mode,
    .version,
    .label {
      color: var(--muted);
      font-size: clamp(7px, 1.5vw, 10px);
      letter-spacing: .12em;
      text-transform: uppercase;
    }

    .pill {
      padding: 4px 8px;
      border: 1px solid #3d7b87;
      border-radius: 999px;
      color: #b9d7dc;
      font-size: clamp(7px, 1.4vw, 9px);
      white-space: nowrap;
    }

    main {
      position: relative;
      z-index: 1;
      display: grid;
      grid-template-columns: 1.25fr .75fr;
      gap: 2.5%;
      min-height: 0;
      padding: 2.5%;
    }

    .card {
      min-width: 0;
      padding: 5%;
      border: 1px solid var(--line);
      border-radius: 9px;
      background: linear-gradient(145deg, #102f3aeb, #091b23f2);
    }

    .hero {
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      border-color: #b87325;
    }

    h1 {
      margin: 5px 0 4px;
      font-size: clamp(18px, 5vw, 34px);
      line-height: 1;
      letter-spacing: -.04em;
    }

    .hero p {
      max-width: 38ch;
      margin: 0;
      color: #b5cdd2;
      font-size: clamp(8px, 1.75vw, 12px);
    }

    .ready {
      display: flex;
      align-items: center;
      gap: 8px;
      color: var(--cyan);
      font-weight: 800;
      letter-spacing: .08em;
    }

    .ready::before {
      content: "";
      width: 9px;
      height: 9px;
      border-radius: 50%;
      background: var(--cyan);
      box-shadow: 0 0 12px var(--cyan);
    }

    .status-list {
      display: grid;
      grid-template-rows: repeat(3, 1fr);
      gap: 6px;
    }

    .status {
      display: flex;
      flex-direction: column;
      justify-content: center;
      padding: 8%;
    }

    .status strong {
      margin-top: 2px;
      color: var(--text);
      font-size: clamp(10px, 2.25vw, 15px);
    }

    .status strong.idle { color: var(--orange); }

    footer span:last-child {
      color: var(--cyan);
      font-size: clamp(7px, 1.4vw, 9px);
      letter-spacing: .08em;
    }

    @media (max-width: 560px) {
      body { padding: 10px; }
      .device { padding: 5px; border-radius: 13px; }
      header, footer { padding-block: 1.7%; }
    }
  </style>
</head>
<body>
  <div class="device">
    <section class="screen" aria-label="GNOME HOME dashboard">
      <header>
        <div>
          <div class="brand">GNOME <span>HOME</span></div>
          <div class="mode">Piglet base · dashboard</div>
        </div>
        <span class="pill">SYSTEM ONLINE</span>
      </header>

      <main>
        <article class="card hero">
          <div>
            <div class="label">Boot status</div>
            <h1>Dashboard ready.</h1>
            <p>The interface has started successfully. Features will arrive independently in future branches.</p>
          </div>
          <div class="ready">READY FOR MODULES</div>
        </article>

        <aside class="status-list" aria-label="Module status">
          <div class="card status">
            <span class="label">GPS</span>
            <strong class="idle">NOT CONFIGURED</strong>
          </div>
          <div class="card status">
            <span class="label">Radio</span>
            <strong class="idle">IDLE</strong>
          </div>
          <div class="card status">
            <span class="label">Storage</span>
            <strong class="idle">NOT MOUNTED</strong>
          </div>
        </aside>
      </main>

      <footer>
        <span class="version">FIGLICIOUS · INITIAL BUILD</span>
        <span>DASHBOARD ONLY</span>
      </footer>
    </section>
  </div>
</body>
</html>
